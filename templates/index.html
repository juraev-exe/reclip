<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReClip — Free Media Downloader</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040507;
      --fg: #f5f7fb;
      --accent: #4de7ff;
      --accent-hover: #a2f7ff;
      --accent-glow: rgba(77, 231, 255, 0.22);
      --muted: #8d97a8;
      --card: rgba(13, 17, 24, 0.88);
      --card-surface: rgba(18, 22, 31, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --success: #77f7ad;
      --error: #ff7188;
      --radius: 16px;
      --shimmer: linear-gradient(90deg, rgba(255, 255, 255, 0.02) 25%, rgba(255, 255, 255, 0.07) 50%, rgba(255, 255, 255, 0.02) 75%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Mono', monospace;
      background:
        radial-gradient(1100px circle at 12% -8%, rgba(77, 231, 255, 0.16), transparent 32%),
        radial-gradient(900px circle at 88% 8%, rgba(119, 247, 173, 0.08), transparent 28%),
        radial-gradient(700px circle at 50% 110%, rgba(255, 113, 136, 0.07), transparent 26%),
        linear-gradient(180deg, #040507 0%, #07090d 100%);
      color: var(--fg);
      min-height: 100vh;
      overflow-x: hidden;
      color-scheme: dark;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: '';
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 18%, rgba(77, 231, 255, 0.08), transparent 18%),
        radial-gradient(circle at 82% 14%, rgba(119, 247, 173, 0.05), transparent 16%),
        radial-gradient(circle at 70% 82%, rgba(255, 113, 136, 0.04), transparent 18%);
      filter: blur(38px);
      opacity: 0.85;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.06;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 128px;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 0 auto;
      padding: 72px 24px 88px;
    }

    .brand { margin-bottom: 48px; }
    .brand h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(3.5rem, 8vw, 4.6rem);
      font-weight: 400;
      letter-spacing: -0.05em;
      line-height: 1;
      color: var(--fg);
      text-shadow: 0 0 24px rgba(77, 231, 255, 0.12);
    }
    .brand h1 em {
      font-style: italic;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(77, 231, 255, 0.32);
    }
    .brand p {
      margin-top: 10px;
      font-size: 0.78rem;
      color: #9aa4b8;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius);
      background: rgba(8, 10, 14, 0.94);
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      outline: none;
      resize: none;
      min-height: 56px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 18px 42px rgba(0, 0, 0, 0.28);
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
      margin-bottom: 6px;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow:
        0 0 0 4px rgba(77, 231, 255, 0.12),
        0 20px 48px rgba(0, 0, 0, 0.4);
      transform: translateY(-1px);
    }
    textarea::placeholder { color: var(--muted); }

    .hint {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .pill-group {
      display: flex;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(10, 12, 17, 0.92);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
    }
    .pill {
      padding: 9px 18px;
      font-family: 'DM Mono', monospace;
      font-size: 0.76rem;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .pill.active {
      background: linear-gradient(180deg, rgba(77, 231, 255, 0.18), rgba(77, 231, 255, 0.08));
      color: var(--fg);
      box-shadow: inset 0 0 0 1px rgba(77, 231, 255, 0.22);
    }
    .pill:not(.active):hover { color: var(--fg); }

    .fetch-btn {
      flex: 1;
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--accent) 0%, #1cd0ea 100%);
      color: #021014;
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow:
        0 16px 32px rgba(77, 231, 255, 0.16),
        0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    }
    .fetch-btn:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
      box-shadow:
        0 20px 36px rgba(77, 231, 255, 0.22),
        0 0 24px rgba(77, 231, 255, 0.12);
    }
    .fetch-btn:active { transform: translateY(0); }
    .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Cards */
    .cards { margin-top: 24px; }

    .card {
      display: flex;
      gap: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(18, 22, 31, 0.96), rgba(10, 13, 19, 0.9)),
        var(--card-surface);
      padding: 14px;
      margin-bottom: 10px;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow:
        0 22px 52px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-thumb {
      width: 120px;
      min-width: 120px;
      height: 80px;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
      position: relative;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* No-thumbnail icon */
    .card-thumb .no-thumb {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .card-thumb .no-thumb svg {
      width: 28px;
      height: 28px;
      opacity: 0.7;
    }

    /* Shimmer skeleton for loading state */
    .card-thumb.loading {
      background: var(--shimmer);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-line {
      height: 12px;
      border-radius: 4px;
      background: var(--shimmer);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      margin-bottom: 6px;
    }
    .skeleton-line.short { width: 40%; height: 10px; }
    .skeleton-line.medium { width: 75%; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card-title {
      font-family: 'Instrument Serif', serif;
      font-size: 1.06rem;
      line-height: 1.3;
      color: var(--fg);
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-meta {
      font-size: 0.68rem;
      color: #92a0b6;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .card-dl-btn {
      padding: 6px 14px;
      border: 1px solid rgba(77, 231, 255, 0.22);
      border-radius: 8px;
      background: rgba(77, 231, 255, 0.12);
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .card-dl-btn:hover {
      border-color: rgba(77, 231, 255, 0.35);
      background: rgba(77, 231, 255, 0.18);
      box-shadow: 0 0 0 3px rgba(77, 231, 255, 0.08);
    }
    .card-dl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .card-dl-btn.done {
      background: rgba(119, 247, 173, 0.16);
      color: var(--success);
      border-color: rgba(119, 247, 173, 0.25);
    }
    .card-dl-btn.error {
      background: rgba(255, 113, 136, 0.14);
      color: var(--error);
      border-color: rgba(255, 113, 136, 0.26);
    }

    .card-status {
      font-size: 0.68rem;
      color: var(--muted);
    }
    .card-status.downloading { color: var(--accent); }
    .card-status.done { color: var(--success); }
    .card-status.error { color: var(--error); }

    .q-chip {
      padding: 4px 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      cursor: pointer;
      transition: all 0.2s;
      }
    .q-chip.active {
      border-color: rgba(77, 231, 255, 0.28);
      color: var(--accent);
      background: rgba(77, 231, 255, 0.08);
    }
    .q-chip:hover:not(.active) { border-color: rgba(255, 255, 255, 0.18); color: var(--fg); }

    /* Error card */
    .card.card-error {
      border-color: rgba(255, 113, 136, 0.22);
      background: linear-gradient(180deg, rgba(34, 14, 20, 0.88), rgba(16, 10, 14, 0.9));
    }
    .card-error-icon {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 113, 136, 0.08);
      color: var(--error);
    }
    .card-error-icon svg {
      width: 24px;
      height: 24px;
    }
    .card-error-msg {
      font-size: 0.72rem;
      color: var(--error);
      margin-top: 2px;
      line-height: 1.4;
    }
    .card-error-url {
      font-size: 0.65rem;
      color: var(--muted);
      word-break: break-all;
      margin-top: 4px;
    }

    /* Download all bar */
    .dl-all-bar {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .dl-all-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid rgba(77, 231, 255, 0.22);
      border-radius: 12px;
      background: rgba(77, 231, 255, 0.12);
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    }
    .dl-all-btn:hover {
      background: rgba(77, 231, 255, 0.16);
      border-color: rgba(77, 231, 255, 0.32);
      box-shadow: 0 0 0 3px rgba(77, 231, 255, 0.08);
    }
    .dl-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .history {
      margin-top: 44px;
      padding-top: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .history-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .history-title {
      font-family: 'Instrument Serif', serif;
      font-size: 1.7rem;
      font-weight: 400;
      text-shadow: 0 0 18px rgba(77, 231, 255, 0.08);
    }
    .history-clear, .history-action {
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    .history-clear:hover, .history-action:hover { color: var(--accent); }
    .history-empty {
      color: var(--muted);
      font-size: 0.72rem;
      padding: 18px 0;
    }
    .history-item {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .history-thumb {
      width: 72px;
      height: 48px;
      border-radius: 7px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.04);
    }
    .history-name {
      font-family: 'Instrument Serif', serif;
      font-size: 0.95rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-meta {
      color: var(--muted);
      font-size: 0.62rem;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .history-actions {
      display: flex;
      gap: 9px;
      align-items: center;
    }
    .history-action.download { color: var(--success); }
    .history-action.disabled { opacity: 0.4; cursor: default; }

    .spin {
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.8;
    }

    ::selection {
      background: rgba(77, 231, 255, 0.22);
      color: var(--fg);
    }

    /* Mobile */
    @media (max-width: 500px) {
      .brand h1 { font-size: 3rem; }
      .page { padding: 40px 16px 60px; }
      .card { flex-direction: column; gap: 10px; }
      .card-thumb {
        width: 100%;
        min-width: unset;
        height: 160px;
      }
      .card-title { white-space: normal; }
      .controls { flex-wrap: wrap; }
      .fetch-btn { width: 100%; }
      .history-item { grid-template-columns: 56px minmax(0, 1fr); }
      .history-thumb { width: 56px; height: 42px; }
      .history-actions { grid-column: 2; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <h1>Re<em>Clip</em></h1>
      <p>Free media downloader</p>
    </div>

    <textarea id="urls" placeholder="Paste one or more URLs..." rows="2"></textarea>
    <p class="hint">Multiple links? Separate with spaces, commas, or newlines.</p>

    <div class="controls">
      <div class="pill-group">
        <button class="pill active" data-format="video" onclick="setFormat(this)">MP4</button>
        <button class="pill" data-format="audio" onclick="setFormat(this)">MP3</button>
      </div>
      <button class="fetch-btn" id="goBtn" onclick="go()">Fetch</button>
    </div>

    <div id="cards" class="cards"></div>

    <section class="history">
      <div class="history-head">
        <h2 class="history-title">History</h2>
        <button class="history-clear" id="clearHistoryBtn" onclick="clearHistory()">Clear history</button>
      </div>
      <div id="historyList"><div class="history-empty">No downloads yet.</div></div>
    </section>

    <div class="footer">
      YouTube &middot; TikTok &middot; Instagram &middot; Twitter/X &middot; Reddit &middot; Facebook<br>
      Vimeo &middot; Twitch &middot; Dailymotion &middot; SoundCloud &middot; Loom &middot; Streamable<br>
      Pinterest &middot; Tumblr &middot; Threads &middot; LinkedIn &middot; 1000+ more
    </div>
  </div>

  <script>
    let currentFormat = 'video';
    let cardData = [];
    let historyData = [];

    function setFormat(btn) {
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFormat = btn.dataset.format;
    }

    function parseUrls(text) {
      return [...new Set(text.split(/[\s,]+/).map(u => u.trim()).filter(u => u.startsWith('http')))];
    }

    function fmtDur(s) {
      if (!s) return '';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function friendlyError(err) {
      if (err.includes('Unsupported URL')) return 'This URL is not supported';
      if (err.includes('Video unavailable')) return 'Video is unavailable or private';
      if (err.includes('Private video')) return 'This video is private';
      if (err.includes('HTTP Error 403')) return 'Access denied by the platform';
      if (err.includes('HTTP Error 404')) return 'Video not found';
      if (err.includes('copyright')) return 'Video blocked due to copyright';
      if (err.includes('geo')) return 'Video not available in your region';
      if (err.includes('timed out') || err.includes('Timed out')) return 'Request timed out — try again';
      if (err.includes('network') || err.includes('Network')) return 'Network error — check your connection';
      return err.length > 80 ? err.slice(0, 80) + '...' : err;
    }

    document.getElementById('urls').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
    });

    async function go() {
      const urls = parseUrls(document.getElementById('urls').value);
      if (!urls.length) return;

      const btn = document.getElementById('goBtn');
      const container = document.getElementById('cards');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      container.innerHTML = '';
      cardData = [];

      for (let i = 0; i < urls.length; i++) {
        const url = urls[i];
        const idx = cardData.length;
        cardData.push({ url, status: 'loading' });
        renderCard(idx);

        try {
          const res = await fetch('/api/info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
          });
          const data = await res.json();
          if (data.error) {
            cardData[idx] = { ...cardData[idx], status: 'info-error', error: data.error };
          } else {
            cardData[idx] = {
              ...cardData[idx],
              status: 'ready',
              title: data.title || '',
              thumbnail: data.thumbnail || '',
              duration: data.duration,
              uploader: data.uploader || '',
              formats: data.formats || [],
              selectedFormatId: data.formats?.[0]?.id || null,
            };
          }
        } catch (err) {
          cardData[idx] = { ...cardData[idx], status: 'info-error', error: err.message };
        }
        renderCard(idx);
      }

      if (cardData.filter(c => c.status === 'ready').length > 1) {
        renderDownloadAll();
      }

      btn.disabled = false;
      btn.textContent = 'Fetch';
    }

    function renderCard(idx) {
      const c = cardData[idx];
      let el = document.getElementById(`card-${idx}`);
      if (!el) {
        el = document.createElement('div');
        el.id = `card-${idx}`;
        el.className = 'card';
        document.getElementById('cards').appendChild(el);
      }

      // Loading skeleton
      if (c.status === 'loading') {
        el.className = 'card';
        el.innerHTML = `
          <div class="card-thumb loading"></div>
          <div class="card-body">
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short"></div>
          </div>
        `;
        return;
      }

      // Error state
      if (c.status === 'info-error') {
        el.className = 'card card-error';
        el.innerHTML = `
          <div class="card-thumb">
            <div class="card-error-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title" style="color:var(--error)">Could not fetch video</div>
            <div class="card-error-msg">${esc(friendlyError(c.error || ''))}</div>
            <div class="card-error-url">${esc(c.url)}</div>
          </div>
        `;
        return;
      }

      // Ready / downloading / done / error states
      el.className = 'card';
      const isAudio = currentFormat === 'audio';

      let thumbHtml;
      if (isAudio) {
        thumbHtml = `<div class="no-thumb" style="color:var(--accent)"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`;
      } else if (c.thumbnail) {
        thumbHtml = `<img src="${c.thumbnail}" alt="">`;
      } else {
        thumbHtml = `<div class="no-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;
      }

      let qualityChips = '';
      if (!isAudio && c.formats && c.formats.length > 1) {
        qualityChips = c.formats.map(f =>
          `<button class="q-chip${f.id === c.selectedFormatId ? ' active' : ''}" onclick="pickFormat(${idx}, '${f.id}')">${f.label}</button>`
        ).join('');
      }

      let actionHtml = '';
      if (c.status === 'ready') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx})">Download</button>${qualityChips}`;
      } else if (c.status === 'downloading') {
        actionHtml = `<span class="card-status downloading"><span class="spin"></span> Downloading...</span>`;
      } else if (c.status === 'done') {
        actionHtml = `<button class="card-dl-btn done" onclick="saveCard(${idx})">Save</button>
          <span class="card-status done">${esc(c.filename || '')}</span>`;
      } else if (c.status === 'error') {
        actionHtml = `<button class="card-dl-btn" onclick="dlCard(${idx})">Retry</button>
          <span class="card-status error">${esc(friendlyError(c.error || 'Download failed'))}</span>`;
      }

      el.innerHTML = `
        <div class="card-thumb">${thumbHtml}</div>
        <div class="card-body">
          <div class="card-title">${esc(c.title || 'Untitled')}</div>
          <div class="card-meta">${esc(c.uploader)}${c.duration ? ' · ' + fmtDur(c.duration) : ''}</div>
          <div class="card-actions">${actionHtml}</div>
        </div>
      `;
    }

    function renderDownloadAll() {
      const existing = document.getElementById('dl-all-bar');
      if (existing) existing.remove();

      const bar = document.createElement('div');
      bar.id = 'dl-all-bar';
      bar.className = 'dl-all-bar';
      bar.innerHTML = `<button class="dl-all-btn" onclick="dlAll()">Download All</button>`;
      document.getElementById('cards').appendChild(bar);
    }

    function pickFormat(idx, formatId) {
      cardData[idx].selectedFormatId = formatId;
      renderCard(idx);
    }

    async function dlCard(idx) {
      const c = cardData[idx];
      c.status = 'downloading';
      c.error = null;
      renderCard(idx);

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: c.url,
            format: currentFormat,
            format_id: c.selectedFormatId,
            title: c.title || '',
            thumbnail: c.thumbnail || '',
            uploader: c.uploader || '',
            duration: c.duration,
          }),
        });
        const data = await res.json();
        if (data.error) {
          c.status = 'error';
          c.error = data.error;
          renderCard(idx);
          return;
        }
        c.jobId = data.job_id;
        pollCard(idx);
      } catch (err) {
        c.status = 'error';
        c.error = err.message;
        renderCard(idx);
      }
    }

    function pollCard(idx) {
      const c = cardData[idx];
      const iv = setInterval(async () => {
        try {
          const res = await fetch(`/api/status/${c.jobId}`);
          const data = await res.json();
          if (data.status === 'done') {
            clearInterval(iv);
            c.status = 'done';
            c.filename = data.filename;
            renderCard(idx);
            saveCard(idx);
            loadHistory();
          } else if (data.status === 'error') {
            clearInterval(iv);
            c.status = 'error';
            c.error = data.error;
            renderCard(idx);
          }
        } catch {
          clearInterval(iv);
          c.status = 'error';
          c.error = 'Lost connection to server';
          renderCard(idx);
        }
      }, 1000);
    }

    function saveCard(idx) {
      const c = cardData[idx];
      if (!c.jobId) return;
      const a = document.createElement('a');
      a.href = `/api/file/${c.jobId}`;
      a.download = c.filename || '';
      a.click();
    }

    async function dlAll() {
      const btn = document.querySelector('.dl-all-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Downloading...'; }

      for (let i = 0; i < cardData.length; i++) {
        if (cardData[i].status === 'ready') {
          await dlCard(i);
        }
      }

      if (btn) { btn.disabled = false; btn.textContent = 'Download All'; }
    }

    function fmtHistoryDate(value) {
      if (!value) return '';
      return new Date(value).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    }

    async function loadHistory() {
      try {
        const res = await fetch('/api/history');
        historyData = await res.json();
        renderHistory();
      } catch {
        document.getElementById('historyList').innerHTML = '<div class="history-empty">Could not load history.</div>';
      }
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      document.getElementById('clearHistoryBtn').style.display = historyData.length ? '' : 'none';
      if (!historyData.length) {
        list.innerHTML = '<div class="history-empty">No downloads yet.</div>';
        return;
      }
      list.innerHTML = historyData.map(item => `
        <div class="history-item">
          ${item.thumbnail
            ? `<img class="history-thumb" src="${esc(item.thumbnail)}" alt="">`
            : '<div class="history-thumb"></div>'}
          <div>
            <div class="history-name" title="${esc(item.title)}">${esc(item.title)}</div>
            <div class="history-meta">${esc(item.format)} · ${esc(fmtHistoryDate(item.completed_at))}</div>
          </div>
          <div class="history-actions">
            ${item.file_available
              ? `<a class="history-action download" href="/api/history/${encodeURIComponent(item.id)}/file">Save</a>`
              : '<span class="history-action disabled">Missing</span>'}
            <a class="history-action" href="${esc(item.url)}" target="_blank" rel="noopener">Source</a>
            <button class="history-action" onclick="removeHistory('${esc(item.id)}')">Remove</button>
          </div>
        </div>
      `).join('');
    }

    async function removeHistory(id) {
      await fetch(`/api/history/${encodeURIComponent(id)}`, { method: 'DELETE' });
      loadHistory();
    }

    async function clearHistory() {
      if (!confirm('Clear all download history? Downloaded files will be kept.')) return;
      await fetch('/api/history', { method: 'DELETE' });
      loadHistory();
    }

    loadHistory();
  </script>
</body>
</html>
